[package]
name = "ringfold-engine"
version = "0.1.0"
edition = "2021"
description = "Fast parallel disk scanner that powers the Ringfold UI"
license = "MIT"
publish = false

[[bin]]
name = "ringfold-engine"
path = "src/main.rs"

[dependencies]
rayon = "1"
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
