name: Release

# Push a tag like v0.1.0 to build installers for every platform and
# attach them to a draft GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, args: --win --x64 }
          - { name: linux-x64, os: ubuntu-latest, args: --linux --x64 }
          - { name: macos-arm64, os: macos-latest, args: --mac --arm64 }
          - { name: macos-x64, os: macos-latest, args: --mac --x64, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: npm ci
      - name: Build installers
        run: npm run build && npx electron-builder ${{ matrix.args }} --publish never
        env:
          RINGFOLD_TARGET: ${{ matrix.target }}
          # Builds are unsigned for now.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Ringfold-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
